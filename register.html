<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container nav">
        <a href="index.html" class="logo">CampusConnect</a>

        <nav>
            <a href="index.html">Home</a>
            <a href="events.html">Events</a>
            <a class="active" href="register.html">Register</a>
        </nav>
    </div>
</header>

<section class="page-banner">
    <div class="container">
        <p class="eyebrow">SAVE YOUR SPOT</p>
        <h1>Event Registration</h1>
        <p>Enter your details to register for a campus event.</p>
    </div>
</section>

<section class="container section form-section">

    <form id="registrationForm">

        <h2>Student Details</h2>
        <p>All fields are required.</p>

        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <label for="mobile_no">Mobile No.</label>
        <input type="tel" id="mobile_no" name="mobile_no" placeholder="Enter your 10-digit Mobile No." pattern="[0-9]{10}" minlength="10" maxlength="10" inputmode="numeric" required title="Please enter a valid 10-digit mobile number">
        <label for="studentId">Student ID</label>
        <input type="text" id="studentId" placeholder="Enter your student ID" required>


        <label for="event">Select Event</label>
        <select id="event" required>
          <option value="">Choose an event</option>
          <option value="Technical Symposium">Technical Symposium</option>
          <option value="Campus Hackathon">Campus Hackathon</option>
          <option value="Coding Competition">Coding Competition</option>
        </select>

        <button type="submit" class="btn submit-btn">
            Submit Registration
        </button>

        <p id="message" class="success-message"></p>

        <p class="note">
            This is a practice project. Registration details are not stored
            on a server.
        </p>

    </form>

</section>

<footer>
    <p>© 2026 CampusConnect. All Rights Reserved.</p>
</footer>


<script>
    const form = document.getElementById("registrationForm");
    const message = document.getElementById("message");

    // Automatically select event from the Events page
    const selectedEventFromURL = new URLSearchParams(window.location.search)
        .get("event");

    if (selectedEventFromURL) {
        const eventSelect = document.getElementById("event");

        for (const option of eventSelect.options) {
            if (option.text.trim() === selectedEventFromURL.trim()) {
                eventSelect.value = option.value;
                break;
            }
        }
    }

    // Handle registration
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        // Validate form
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        // Get student details
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim().toLowerCase();
        const mobile = document.getElementById("mobile_no").value.trim();
        const studentId = document.getElementById("studentId").value.trim().toLowerCase();
        const selected = document.getElementById("event").value;

        // Get existing registrations
        let registrations = JSON.parse(
            localStorage.getItem("registrations")
        ) || [];

        // Check for duplicate registration
        const alreadyRegistered = registrations.some(registration =>
            registration.studentId.toLowerCase() === studentId &&
            registration.event === selected
        );

        // Prevent duplicate registration
        if (alreadyRegistered) {
            message.textContent =
                "You have already registered for this event.";

            message.className = "success-message error";
            return;
        }

        // Create new registration
        const newRegistration = {
            name: name,
            email: email,
            mobile: mobile,
            studentId: studentId,
            event: selected
        };

        // Save registration
        registrations.push(newRegistration);

        localStorage.setItem(
            "registrations",
            JSON.stringify(registrations)
        );

        // Display success message
        message.textContent =
            "Thank you, " + name +
            "! Your registration for " + selected +
            " is complete.";

        message.className = "success-message success";

        // Clear form
        form.reset();
    });
</script>


</body>
</html>
